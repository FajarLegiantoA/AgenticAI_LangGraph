name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # Test suite ini sengaja offline: conftest.py menanam API key dummy dan
      # tidak ada test yang memanggil jaringan. Karena itu CI tidak butuh
      # secret apa pun, dan tidak ada biaya API dari CI.
      - name: Tests (offline)
        env:
          MODEL_PROVIDER: ifm
          IFM_API_KEY: ci-key-not-real
        run: pytest -q -m "not slow"

  # Router eval memuat model embedding lokal (~1 GB) dan butuh beberapa menit,
  # jadi tidak dijalankan di setiap push. Jalankan manual lewat
  # workflow_dispatch, atau ubah pemicunya kalau kamu ingin lebih sering.
  router-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-qwen3-embedding-0.6b

      - name: Router evaluation (DEV + HELDOUT)
        run: python router_eval.py
